<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Janu Print FAB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --metallic-blue: #00c3dd;
    --metallic-blue-dark: #1e4563;
    --gold-accent: #d4af37;
    --gold-gradient: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #f6d365 100%);
    --white: #ffffff;
    --light-gray: #f8f9fa;
    --text-dark: #333333;
    --success: #1e8a3c;
    --danger: #c0392b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--metallic-blue-dark);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center; padding:1rem;
  }
  .card {
    background: var(--white); width:100%; max-width:420px; border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); border-top:4px solid var(--metallic-blue); padding:2.5rem;
  }
  h1 { color: var(--metallic-blue-dark); font-size:1.5rem; text-align:center; margin-bottom:0.4rem; }
  p { color:#666; font-size:0.9rem; text-align:center; margin-bottom:1.5rem; }
  label { display:block; font-size:0.85rem; font-weight:600; color: var(--text-dark); margin-bottom:0.45rem; }
  input {
    width:100%; padding:12px 14px; margin-bottom:1rem; border:2px solid var(--light-gray); border-radius:10px;
    font-family:'Poppins', sans-serif; font-size:0.95rem;
  }
  input:focus { outline:none; border-color: var(--metallic-blue); }
  button {
    width:100%; padding:14px; border:none; border-radius:50px; cursor:pointer; background:var(--gold-gradient);
    color: var(--metallic-blue-dark); font-weight:700; font-size:1rem;
  }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .message {
    display:none; padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:1rem;
  }
  .message.error { display:block; background:#fdecea; color: var(--danger); }
  .message.success { display:block; background:#e9f8ee; color: var(--success); }
  .meta { text-align:center; margin-top:1rem; }
  .meta a { color: var(--metallic-blue-dark); text-decoration:none; font-weight:600; font-size:0.82rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p>Enter your admin email and we will send a reset link.</p>
    <div id="message" class="message"></div>
    <form id="resetForm">
      <label for="email">Admin email</label>
      <input type="email" id="email" required placeholder="you@example.com">
      <button type="submit" id="submitBtn">Send reset email</button>
    </form>
    <div class="meta"><a href="login.html">Back to admin login</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function setMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      setMessage('', '');

      const { error } = await window.db.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/admin/login.html`
      });

      if (error) {
        setMessage(error.message || 'Unable to send reset email.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset email';
        return;
      }

      setMessage('Check your inbox for the reset link. If the email is not found, confirm it is the admin account address.', 'success');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset email';
      form.reset();
    });
  </script>
</body>
</html>
