<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Reset Password | Janu Print FAB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --metallic-blue: #00c3dd;
    --metallic-blue-dark: #1e4563;
    --gold-accent: #d4af37;
    --gold-gradient: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #f6d365 100%);
    --white: #ffffff;
    --light-gray: #f8f9fa;
    --text-dark: #333333;
    --success: #1e8a3c;
    --danger: #c0392b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--metallic-blue-dark);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center; padding:1rem;
  }
  .card {
    background: var(--white); width:100%; max-width:420px; border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); border-top:4px solid var(--metallic-blue); padding:2.5rem;
  }
  h1 { color: var(--metallic-blue-dark); font-size:1.5rem; text-align:center; margin-bottom:0.4rem; }
  p { color:#666; font-size:0.9rem; text-align:center; margin-bottom:1.5rem; }
  label { display:block; font-size:0.85rem; font-weight:600; color: var(--text-dark); margin-bottom:0.45rem; }
  input {
    width:100%; padding:12px 14px; margin-bottom:1rem; border:2px solid var(--light-gray); border-radius:10px;
    font-family:'Poppins', sans-serif; font-size:0.95rem;
  }
  input:focus { outline:none; border-color: var(--metallic-blue); }
  button {
    width:100%; padding:14px; border:none; border-radius:50px; cursor:pointer; background:var(--gold-gradient);
    color: var(--metallic-blue-dark); font-weight:700; font-size:1rem;
  }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .message {
    display:none; padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:1rem;
  }
  .message.error { display:block; background:#fdecea; color: var(--danger); }
  .message.success { display:block; background:#e9f8ee; color: var(--success); }
  .meta { text-align:center; margin-top:1rem; }
  .meta a { color: var(--metallic-blue-dark); text-decoration:none; font-weight:600; font-size:0.82rem; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Reset Password</h1>
    <p id="intro">Enter your admin email and we will send a reset link.</p>
    <div id="message" class="message"></div>

    <form id="resetForm">
      <label for="email">Admin email</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="username">
      <button type="submit" id="submitBtn">Send reset email</button>
    </form>

    <form id="newForm" style="display:none">
      <label for="newPw">New password</label>
      <input type="password" id="newPw" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="newPw2">Confirm new password</label>
      <input type="password" id="newPw2" required minlength="8" autocomplete="new-password" placeholder="Repeat the password">
      <button type="submit" id="saveBtn">Save new password</button>
    </form>

    <div class="meta"><a href="login.html">Back to admin login</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const resetForm = $('resetForm'), newForm = $('newForm'), message = $('message');
    let recovery = false;

    function setMessage(text, type) {
      message.textContent = text || '';
      message.className = 'message ' + (type || '');
    }

    function showNewPasswordForm() {
      recovery = true;
      resetForm.style.display = 'none';
      newForm.style.display = 'block';
      $('title').textContent = 'Choose a new password';
      $('intro').textContent = 'Enter a new password for your admin account.';
      setMessage('', '');
    }

    // Supabase puts either a recovery session or an error in the link the admin clicked.
    const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
    const queryParams = new URLSearchParams(location.search);
    const linkError = hashParams.get('error_description') || queryParams.get('error_description');
    if (linkError) {
      setMessage('This reset link is invalid or has expired. Please request a new one.', 'error');
    }

    // The client fires PASSWORD_RECOVERY once it has read the link and created the recovery session.
    window.db.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showNewPasswordForm();
    });
    if (hashParams.get('type') === 'recovery') showNewPasswordForm();

    // Step 1: send the e-mail. The link comes back to THIS page.
    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = $('email').value.trim();
      if (!email) return;
      const btn = $('submitBtn');
      btn.disabled = true; btn.textContent = 'Sending...'; setMessage('', '');

      const { error } = await window.db.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/admin/reset-password.html`
      });

      if (error) {
        setMessage(error.message || 'Unable to send reset email.', 'error');
      } else {
        setMessage('If that address belongs to an admin account, a reset link is on its way. Check your inbox (and spam).', 'success');
        resetForm.reset();
      }
      btn.disabled = false; btn.textContent = 'Send reset email';
    });

    // Step 2: save the new password.
    newForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!recovery) return;
      const pw = $('newPw').value, pw2 = $('newPw2').value;
      if (pw.length < 8) return setMessage('Password must be at least 8 characters.', 'error');
      if (/\s/.test(pw)) return setMessage('Password must not contain spaces.', 'error');
      if (pw !== pw2) return setMessage('The two passwords do not match.', 'error');

      const btn = $('saveBtn');
      btn.disabled = true; btn.textContent = 'Saving...'; setMessage('', '');

      const { error } = await window.db.auth.updateUser({ password: pw });
      if (error) {
        setMessage(error.message || 'Could not save the new password. Request a new reset link and try again.', 'error');
        btn.disabled = false; btn.textContent = 'Save new password';
        return;
      }

      setMessage('Password updated. Redirecting to the login page...', 'success');
      await window.db.auth.signOut();
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    });
  </script>
</body>
</html>
