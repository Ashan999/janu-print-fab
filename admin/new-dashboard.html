<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Janu Print | FAB - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#151a26;--ink2:#222a3b;--paper:#f3f6fa;--card:#fff;--line:#dde3ec;--tx:#1b2230;--mut:#667085;--c:#0a9fd0;--m:#d6336c;--y:#f2b705;--g:#1f9d63;--b:#3b4cca}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'DM Sans',system-ui,sans-serif;color:var(--tx);background:var(--paper)}
h1,h2,h3{font-family:Sora,'DM Sans',sans-serif;margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--c);color:#fff;font-weight:700}
button.ghost{background:#fff;color:var(--tx);border:1px solid var(--line)}button.bad{background:var(--m)}button.ok{background:var(--g)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--y);outline-offset:1px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=checkbox]{width:auto}textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}label input,label select,label textarea{margin-top:3px;color:var(--tx)}
#app{display:none;min-height:100vh}
nav{position:fixed;inset:0 auto 0 0;width:220px;background:var(--ink);color:#cfd6e4;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.logo{font:700 17px Sora;color:#fff;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
.reg{display:grid;grid-template-columns:8px 8px;gap:2px}.reg i{width:8px;height:8px;border-radius:50%}
nav a{color:inherit;text-decoration:none;padding:10px;border-radius:8px;display:flex;justify-content:space-between}
nav a.on{background:var(--ink2);color:#fff;box-shadow:inset 3px 0 var(--c)}
nav a:hover{background:var(--ink2)}
.badge{background:var(--m);color:#fff;border-radius:99px;font-size:12px;padding:0 8px;font-weight:700}
nav .sp{flex:1}
main{margin-left:220px;padding:24px;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:4px solid var(--c)}
.kpi b{display:block;font:700 26px Sora}.kpi span{color:var(--mut);font-size:13px}
.press{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0}
.press i{display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.legend s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;text-decoration:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:13px;border-bottom:1px solid var(--line);padding:8px}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr[data-act]{cursor:pointer}tr[data-act]:hover td{background:#f7fafd}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--mut)}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.filters>*{width:auto;min-width:160px}
.m{color:var(--mut);font-size:13px}.empty{text-align:center;color:var(--mut);padding:30px}
.dr{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;box-shadow:-8px 0 30px #0003;padding:18px;overflow:auto;display:none;z-index:20}
.dr.open{display:block}.dr section{border-top:1px solid var(--line);padding:12px 0}.dr h3{font-size:14px;margin-bottom:6px}
.dh{display:flex;justify-content:space-between;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{width:auto;flex:1}
.item{background:var(--paper);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#fff;color:var(--tx);border:1px solid var(--line)}.tabs button.on{background:var(--ink);color:#fff}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:50}
.t{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;max-width:340px;border-left:5px solid var(--c)}.t.ok{border-color:var(--g)}.t.err{border-color:var(--m)}.t.new{border-color:var(--y)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
@media(max-width:820px){nav{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:8px}.logo,nav .sp{display:none}nav a{white-space:nowrap;gap:8px}main{margin:0;padding:14px}}
@media(prefers-reduced-motion:no-preference){.t{animation:in .25s}@keyframes in{from{transform:translateY(8px);opacity:0}}}
</style></head><body>
<div id="login" class="card" style="display:none">
  <div class="logo" style="color:var(--tx)"><span class="reg"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:var(--ink)"></i></span>Janu Print | FAB</div>
  <h2>Admin sign in</h2><p class="m">Use the admin email and password you created in Supabase.</p>
  <label>Email<input id="em" type="email" autocomplete="username"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <button data-act="login" style="width:100%">Sign in</button>
</div>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<aside class="dr" id="dr" aria-label="Order details"></aside>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config/supabase-config.js"></script>
<script>
/* ===== SETTINGS - change here only if your database uses different names ===== */
const CFG={
 SUPABASE_URL:'https://gilveahoqqbgqomerrov.supabase.co',
 SUPABASE_KEY:'',                       // only needed if ../config/supabase-config.js is not found
 STATUSES:['Pending','Accepted','Printing','Ready','Completed','Cancelled'],
 PAY_OK:'paid',PAY_NO:'rejected',
 ART_BUCKET:'artwork',SLIP_BUCKET:'payment-slips',
 GROUPS:{
  catalogue:{title:'Catalogue',tables:['categories','products','gallery']},
  pricing:{title:'Pricing',tables:['printing_methods','print_locations','products']},
  site:{title:'Site and delivery',tables:['homepage_settings','contact_details']}
 },
 IMG_BUCKET:{categories:'products',products:'products',gallery:'gallery',homepage_settings:'branding',contact_details:'branding'}
};
const COLORS={pending:'#f2b705',accepted:'#0a9fd0',printing:'#3b4cca',ready:'#1f9d63',completed:'#4b5565',cancelled:'#d6336c'};
const db=window.db||(window.supabase&&CFG.SUPABASE_KEY?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY):null);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=(o,ks)=>{for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k]};
const txt=v=>v&&typeof v==='object'?Object.values(v).filter(Boolean).join(', '):(v??'');
const ref=o=>pick(o,['order_number'])||'#'+String(o.id).slice(0,8).toUpperCase();
const money=n=>n==null?'-':'Rs '+Number(n).toLocaleString('en-LK',{maximumFractionDigits:2});
const fmt=d=>d?new Date(d).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'-';
const total=o=>pick(o,['total_price','total_amount','total','grand_total','payment_amount']);
const cust=o=>{let c=o.customers;if(Array.isArray(c))c=c[0];c=c||{};return{name:pick(c,['name','full_name'])||pick(o,['customer_name']),phone:pick(c,['phone'])||pick(o,['customer_phone','phone']),email:pick(c,['email'])||pick(o,['customer_email','email'])}};
const receipt=o=>pick(o,['payment_receipt_url','payment_slip_url']);
const needsPay=o=>receipt(o)&&![CFG.PAY_OK,CFG.PAY_NO].includes(o.payment_status);
const chip=(s,c)=>`<span class="chip" style="background:${c||COLORS[String(s).toLowerCase()]||'#667085'}">${esc(s||'-')}</span>`;
const payChip=o=>chip(o.payment_status||'no payment',o.payment_status===CFG.PAY_OK?'#1f9d63':o.payment_status===CFG.PAY_NO?'#d6336c':needsPay(o)?'#f2b705':'#667085');
function toast(m,t='ok'){const e=document.createElement('div');e.className='t '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),t==='err'?7000:4000)}
const S={orders:[],seen:null,fresh:0,rows:[],table:null};

/* ===== sign in ===== */
async function isAdmin(u){const{data,error}=await db.from('admin_profiles').select('*');return !error&&(data||[]).some(r=>Object.values(r).includes(u.id))}
async function boot(){
 if(!db){document.body.innerHTML='<p style="padding:24px">Supabase client not found. Put this file in the admin folder next to ../config/supabase-config.js, or add your public key in SUPABASE_KEY.</p>';return}
 const{data:{session}}=await db.auth.getSession();
 if(session&&await isAdmin(session.user))start();else $('#login').style.display='block';
}
async function login(){
 const{data,error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)return toast(error.message,'err');
 if(!await isAdmin(data.user)){await db.auth.signOut();return toast('This account is not in admin_profiles.','err')}
 $('#login').style.display='none';start();
}
async function start(){
 $('#app').style.display='block';
 await loadOrders();S.seen=new Set(S.orders.map(o=>o.id));
 db.channel('orders-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},poll).subscribe();
 setInterval(poll,5000);document.addEventListener('visibilitychange',()=>!document.hidden&&poll());
 addEventListener('hashchange',render);render();
}

/* ===== data ===== */
async function loadOrders(){
 let r=await db.from('orders').select('*,customers(*),order_items(*)').order('created_at',{ascending:false}).limit(500);
 if(r.error)r=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(500);
 if(r.error)toast('Could not load orders: '+r.error.message,'err');else S.orders=r.data||[];
}
let polling=false;
async function poll(){
 if(polling||!S.seen)return;polling=true;
 try{
  const r=await db.from('orders').select('id').order('created_at',{ascending:false}).limit(30);
  if(r.error)return;
  const ids=r.data.map(x=>x.id).filter(i=>!S.seen.has(i));if(!ids.length)return;
  ids.forEach(i=>S.seen.add(i));await loadOrders();
  ids.forEach(i=>{const o=S.orders.find(x=>x.id==i);if(!o)return;S.fresh++;
   const m='New order '+ref(o)+(cust(o).name?' from '+cust(o).name:'')+' - '+money(total(o));
   toast(m,'new');beep();if('Notification' in window&&Notification.permission==='granted')new Notification('Janu Print | FAB',{body:m})});
  document.title='('+S.fresh+') Janu Print | FAB - Admin';render();
 }finally{polling=false}
}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.18)}catch(e){}}

/* ===== layout ===== */
const NAV=[['dashboard','Dashboard'],['orders','Orders'],['payments','Payments'],['catalogue','Catalogue'],['pricing','Pricing'],['site','Site and delivery']];
function render(){
 const v=(location.hash||'#dashboard').slice(1);
 if(v==='orders'&&S.fresh){S.fresh=0;document.title='Janu Print | FAB - Admin'}
 $('#nav').innerHTML='<div class="logo"><span class="reg"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:#fff"></i></span>Janu Print | FAB</div>'+
  NAV.map(([k,t])=>`<a href="#${k}" class="${v===k?'on':''}">${t}${k==='orders'&&S.fresh?`<span class="badge">${S.fresh}</span>`:''}</a>`).join('')+
  '<div class="sp"></div><a href="#" data-act="alerts">Turn on alerts</a><a href="#" data-act="logout">Sign out</a>';
 const m=$('#main');
 if(v==='orders')m.innerHTML=viewOrders();
 else if(v==='payments')m.innerHTML=viewPayments();
 else if(CFG.GROUPS[v])viewContent(v);
 else m.innerHTML=viewDash();
}

/* ===== dashboard ===== */
function viewDash(){
 const O=S.orders,day=new Date().toDateString();
 const by=s=>O.filter(o=>String(o.status).toLowerCase()===s.toLowerCase()).length;
 const paid=O.filter(o=>o.payment_status===CFG.PAY_OK).reduce((a,o)=>a+Number(total(o)||0),0);
 const stages=CFG.STATUSES.map(s=>[s,by(s)]),sum=stages.reduce((a,x)=>a+x[1],0)||1;
 const need=O.filter(needsPay);
 return `<div class="top"><h1>Dashboard</h1><span class="m">Live from your database. New orders appear within 5 seconds.</span></div>
 <div class="kpis">
  <div class="kpi"><b>${O.length}</b><span>Orders loaded</span></div>
  <div class="kpi" style="border-color:var(--y)"><b>${O.filter(o=>new Date(o.created_at).toDateString()===day).length}</b><span>Orders today</span></div>
  <div class="kpi" style="border-color:var(--m)"><b>${need.length}</b><span>Receipts to review</span></div>
  <div class="kpi" style="border-color:var(--g)"><b>${money(paid)}</b><span>Confirmed payments</span></div></div>
 <div class="card"><h3>Orders on the press</h3>
  <div class="press">${stages.map(([s,n])=>`<i style="width:${n/sum*100}%;background:${COLORS[s.toLowerCase()]||'#667085'}"></i>`).join('')}</div>
  <div class="legend">${stages.map(([s,n])=>`<span><s style="background:${COLORS[s.toLowerCase()]||'#667085'}"></s>${esc(s)} ${n}</span>`).join('')}</div></div>
 ${need.length?`<div class="card"><h3>Waiting for your payment decision</h3>${ordTable(need.slice(0,6))}</div>`:''}
 <div class="card"><h3>Recent orders</h3>${ordTable(O.slice(0,8))}</div>`;
}

/* ===== orders ===== */
function ordTable(list){
 if(!list.length)return '<div class="empty">No orders here yet.</div>';
 return `<div class="tw"><table><tr><th>Order</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th></tr>${list.map(o=>`<tr data-act="open" data-id="${esc(o.id)}"><td><b>${esc(ref(o))}</b></td><td>${fmt(o.created_at)}</td><td>${esc(cust(o).name||'-')}<br><span class="m">${esc(cust(o).phone||'')}</span></td><td>${money(total(o))}</td><td>${chip(o.status)}</td><td>${payChip(o)}</td></tr>`).join('')}</table></div>`;
}
function viewOrders(){
 const q=(S.q||'').toLowerCase(),st=S.st||'';
 const list=S.orders.filter(o=>(!st||String(o.status).toLowerCase()===st.toLowerCase())&&(!q||(ref(o)+' '+cust(o).name+' '+cust(o).phone).toLowerCase().includes(q)));
 return `<div class="top"><h1>Orders</h1><button class="ghost" data-act="reload">Refresh</button></div>
 <div class="filters"><input id="q" placeholder="Search order, name or phone" value="${esc(S.q||'')}"><select id="st"><option value="">All statuses</option>${CFG.STATUSES.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="card">${ordTable(list)}</div>`;
}
function viewPayments(){
 const L=S.orders.filter(o=>receipt(o)||o.payment_submitted_at||o.payment_reference);
 return `<div class="top"><h1>Payments</h1><span class="m">History of submitted receipts. Approve or reject inside the order.</span></div><div class="card">${L.length?`<div class="tw"><table><tr><th>Order</th><th>Submitted</th><th>Method</th><th>Amount</th><th>Reference</th><th>Status</th><th></th></tr>${L.map(o=>`<tr><td><b>${esc(ref(o))}</b></td><td>${fmt(o.payment_submitted_at||o.created_at)}</td><td>${esc(o.payment_method||'-')}</td><td>${money(pick(o,['payment_amount'])??total(o))}</td><td>${esc(o.payment_reference||'-')}</td><td>${payChip(o)}</td><td>${receipt(o)?`<button class="ghost" data-act="file" data-bucket="${CFG.SLIP_BUCKET}" data-path="${esc(receipt(o))}">Receipt</button> `:''}<button class="ghost" data-act="open" data-id="${esc(o.id)}">Open order</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No payment receipts yet.</div>'}</div>`;
}
function openOrder(id){
 const o=S.orders.find(x=>x.id==id);if(!o)return;const c=cust(o),items=o.order_items||[];
 const sts=CFG.STATUSES.includes(o.status)||!o.status?CFG.STATUSES:[o.status,...CFG.STATUSES];
 const iso=o.estimated_delivery?new Date(new Date(o.estimated_delivery)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 $('#dr').innerHTML=`<div class="dh"><div><h2>${esc(ref(o))}</h2><span class="m">${fmt(o.created_at)}</span></div><button class="ghost" data-act="close">Close</button></div>
 <section><h3>Customer</h3><p>${esc(c.name||'-')}<br>${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a> `:''}${esc(c.email||'')}</p><p class="m">${esc(txt(pick(o,['delivery_address','address','shipping_address']))||'No address saved')}</p></section>
 <section><h3>Items - ${money(total(o))}</h3>${items.length?items.map(it=>{
   const op=pick(it,['options','selected_options','details']),files=[];
   Object.entries(it).forEach(([k,v])=>{if(/art|file|design/i.test(k))(Array.isArray(v)?v:[v]).forEach(x=>typeof x==='string'&&x&&files.push(x))});
   return `<div class="item"><b>${esc(pick(it,['product_name','name','title'])||'Item')}</b> x ${esc(pick(it,['quantity','qty'])||1)} <span class="m">${money(pick(it,['line_total','total_price','total','price']))}</span>
   ${op&&typeof op==='object'?`<div class="m">${Object.entries(op).map(([k,v])=>esc(k)+': '+esc(txt(v))).join(' | ')}</div>`:''}
   ${files.map((f,i)=>`<button class="ghost" style="margin-top:6px" data-act="file" data-bucket="${CFG.ART_BUCKET}" data-path="${esc(f)}">Artwork ${i+1}</button> `).join('')}</div>`}).join(''):'<p class="m">No items found for this order.</p>'}</section>
 <section><h3>Order status</h3><div class="row"><select id="nst">${sts.map(s=>`<option ${s===o.status?'selected':''}>${esc(s)}</option>`).join('')}</select><button data-act="status" data-id="${esc(o.id)}">Save status</button></div></section>
 <section><h3>Payment</h3><p>${payChip(o)} <span class="m">${esc(o.payment_method||'')} ${o.payment_reference?'| Ref '+esc(o.payment_reference):''} ${o.payment_amount?'| '+money(o.payment_amount):''}</span></p>${o.payment_notes?`<p class="m">${esc(o.payment_notes)}</p>`:''}
  <div class="row">${receipt(o)?`<button class="ghost" data-act="file" data-bucket="${CFG.SLIP_BUCKET}" data-path="${esc(receipt(o))}">View receipt</button>`:'<span class="m">No receipt uploaded</span>'}
  <button class="ok" data-act="pay" data-v="${CFG.PAY_OK}" data-id="${esc(o.id)}">Approve payment</button><button class="bad" data-act="pay" data-v="${CFG.PAY_NO}" data-id="${esc(o.id)}">Reject</button></div></section>
 <section><h3>Delivery and tracking</h3><div class="row"><label>Courier<input id="dp" value="${esc(o.delivery_provider||'')}"></label><label>Tracking number<input id="tn" value="${esc(o.tracking_number||'')}"></label></div>
  <label>Estimated delivery<input id="edt" type="datetime-local" value="${iso}"></label><button data-act="ship" data-id="${esc(o.id)}">Save tracking</button></section>`;
 $('#dr').classList.add('open');
}
async function patch(id,f,msg){
 const{data,error}=await db.from('orders').update(f).eq('id',id).select().maybeSingle();
 if(error||!data){toast(error?error.message:'Not saved. The database refused the change - the admin update policy on orders may be missing.','err');return false}
 Object.assign(S.orders.find(o=>o.id==id),data);toast(msg,'ok');render();openOrder(id);return true;
}
async function openFile(bucket,raw){
 try{let p=String(raw);const sp=p.split('/'+bucket+'/');if(sp.length>1)p=sp[1].split('?')[0];p=decodeURIComponent(p);
  const{data,error}=await db.storage.from(bucket).createSignedUrl(p,300);if(error)throw error;
  const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener';a.click();
 }catch(e){toast('Could not open file: '+e.message,'err')}
}

/* ===== catalogue / pricing / site: one editor for every table ===== */
async function viewContent(g){
 const G=CFG.GROUPS[g];if(!S.table||!G.tables.includes(S.table))S.table=G.tables[0];
 $('#main').innerHTML=`<div class="top"><h1>${G.title}</h1></div><div class="tabs">${G.tables.map(t=>`<button class="${t===S.table?'on':''}" data-act="tab" data-t="${t}">${t.replace(/_/g,' ')}</button>`).join('')}</div><div class="card" id="ed"><div class="empty">Loading...</div></div>`;
 const t=S.table,r=await db.from(t).select('*').limit(300);
 if(S.table!==t)return;
 if(r.error){$('#ed').innerHTML=`<div class="empty">Could not read table "${esc(t)}": ${esc(r.error.message)}</div>`;return}
 S.rows=r.data||[];
 if(!S.rows.length){$('#ed').innerHTML=`<div class="empty">This table is empty, so its columns are unknown. Add the first row in Supabase, then manage it here.</div>`;return}
 const cols=Object.keys(S.rows[0]).filter(k=>!['created_at','updated_at'].includes(k)&&typeof S.rows[0][k]!=='object').slice(0,6);
 S.cols=cols;
 $('#ed').innerHTML=`<div class="top"><span class="m">${S.rows.length} rows. Click a row to edit.</span><button data-act="new">Add new</button></div><div class="tw"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${S.rows.map((x,i)=>`<tr data-act="edit" data-i="${i}">${cols.map(c=>`<td>${esc(String(x[c]??'').slice(0,60))}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
const RO=['id','created_at','updated_at'];
function editRow(i){
 const isNew=i<0,row=isNew?Object.fromEntries(Object.keys(S.rows[0]).map(k=>[k,typeof S.rows[0][k]==='boolean'?false:null])):S.rows[i];
 const f=Object.entries(row).filter(([k])=>!(isNew&&RO.includes(k))).map(([k,v])=>{
  if(RO.includes(k))return `<label>${k}<input value="${esc(v)}" disabled></label>`;
  if(typeof v==='boolean')return `<label><input type="checkbox" data-k="${k}" ${v?'checked':''}> ${k}</label>`;
  if(typeof v==='number')return `<label>${k}<input type="number" step="any" data-k="${k}" value="${v}"></label>`;
  if(v&&typeof v==='object')return `<label>${k} (JSON)<textarea data-k="${k}" data-json="1">${esc(JSON.stringify(v,null,1))}</textarea></label>`;
  const img=/image|logo|photo|banner|icon|img/i.test(k);
  return `<label>${k}<input data-k="${k}" value="${esc(v)}">${img?`${v?`<img src="${esc(v)}" alt="" style="height:60px;margin:6px 0;border-radius:6px"><br>`:''}<input type="file" accept="image/*" data-up="${k}">`:''}</label>`}).join('');
 $('#dr').innerHTML=`<div class="dh"><h2>${isNew?'Add to':'Edit'} ${esc(S.table.replace(/_/g,' '))}</h2><button class="ghost" data-act="close">Close</button></div><div style="margin-top:12px">${f}</div>
 <div class="row"><button data-act="saverow" data-i="${i}">Save changes</button>${isNew?'':`<button class="bad" data-act="delrow" data-i="${i}">Delete</button>`}</div>`;
 $('#dr').classList.add('open');
}
async function saveRow(i){
 const o={};
 for(const e of document.querySelectorAll('#dr [data-k]')){
  const k=e.dataset.k;
  if(e.type==='checkbox')o[k]=e.checked;
  else if(e.dataset.json){try{o[k]=JSON.parse(e.value||'null')}catch(x){return toast('Invalid JSON in '+k,'err')}}
  else if(e.type==='number')o[k]=e.value===''?null:Number(e.value);
  else o[k]=e.value===''?null:e.value;
 }
 const q=i<0?db.from(S.table).insert(o).select():db.from(S.table).update(o).eq('id',S.rows[i].id).select();
 const{data,error}=await q;
 if(error||!data||!data.length)return toast(error?error.message:'Not saved. The database refused the change - check the admin policy for this table.','err');
 toast('Saved','ok');$('#dr').classList.remove('open');render();
}
async function delRow(i){
 if(!confirm('Delete this row? This cannot be undone.'))return;
 const{data,error}=await db.from(S.table).delete().eq('id',S.rows[i].id).select();
 if(error||!data.length)return toast(error?error.message:'Not deleted. It may be in use, or the policy refused it.','err');
 toast('Deleted','ok');$('#dr').classList.remove('open');render();
}
async function upload(inp){
 const f=inp.files[0];if(!f)return;const k=inp.dataset.up,b=CFG.IMG_BUCKET[S.table]||'products';
 const p=S.table+'/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
 const{error}=await db.storage.from(b).upload(p,f);if(error)return toast('Upload failed: '+error.message,'err');
 document.querySelector(`#dr [data-k="${k}"]`).value=db.storage.from(b).getPublicUrl(p).data.publicUrl;toast('Image uploaded. Now press Save changes.','ok');
}

/* ===== clicks ===== */
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(b.tagName==='A')e.preventDefault();
 if(a==='login')login();
 else if(a==='logout'){await db.auth.signOut();location.reload()}
 else if(a==='alerts'){if('Notification' in window)toast(await Notification.requestPermission()==='granted'?'Desktop alerts are on':'Alerts blocked. In-app alerts still work.','ok')}
 else if(a==='open')openOrder(d.id);
 else if(a==='close')$('#dr').classList.remove('open');
 else if(a==='reload'){await loadOrders();render();toast('Orders refreshed')}
 else if(a==='file')openFile(d.bucket,d.path);
 else if(a==='status'){const v=$('#nst').value;if(await patch(d.id,{status:v},'Status saved: '+v))db.from('order_timeline').insert({order_id:d.id,status:v}).then(()=>{},()=>{})}
 else if(a==='pay')patch(d.id,{payment_status:d.v,payment_verified_at:new Date().toISOString()},d.v===CFG.PAY_OK?'Payment approved':'Payment rejected');
 else if(a==='ship'){const ed=$('#edt').value;patch(d.id,{delivery_provider:$('#dp').value||null,tracking_number:$('#tn').value||null,estimated_delivery:ed?new Date(ed).toISOString():null,dispatched_at:new Date().toISOString()},'Tracking saved')}
 else if(a==='tab'){S.table=d.t;render()}
 else if(a==='edit')editRow(+d.i);
 else if(a==='new')editRow(-1);
 else if(a==='saverow')saveRow(+d.i);
 else if(a==='delrow')delRow(+d.i);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='st'&&!e.target.closest('#dr')){S.st=e.target.value;render()}if(e.target.dataset.up)upload(e.target)});
$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&login());
boot();
</script></body></html>
