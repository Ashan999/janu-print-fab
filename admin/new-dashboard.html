<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4563">
<title>Janu Print | FAB — Admin</title>
<style>
:root{--brand:#1e4563;--c2:#00c3dd;--gold:#d4af37;--bg:#f4f7f9;--sf:#fff;--tx:#1d2b36;--mu:#6b7a86;--bd:#e3e9ee;--ok:#1e8a3c;--wn:#b7791f;--er:#c0392b;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 system-ui,'Noto Sans Sinhala',sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
textarea{min-height:70px;resize:vertical}
label.l{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.side{display:none}
.top{position:sticky;top:0;z-index:20;height:54px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 14px}
.top b,.lg b{color:var(--brand)}.top b span,.lg b span{color:var(--gold)}.sp{flex:1}.top small{color:var(--mu);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none;max-width:980px;margin:auto}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;font-size:13px;text-decoration:none;color:var(--tx)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:12px 14px 60px;max-width:980px;margin:auto}
h1{font-size:22px;margin:6px 0 2px}p.m,.m{color:var(--mu);font-size:13px}
.btn{background:var(--brand);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700}
.btn.alt{background:#fff;color:var(--brand);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}.btn.er{background:#fbe3df;color:var(--er)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.5}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;text-align:left;display:block;width:100%}
.stat b{display:block;font-size:28px;color:var(--brand)}.stat span{font-size:13px;color:var(--mu)}.stat.hot b{color:var(--er)}
.rw{display:flex;align-items:center;gap:10px;justify-content:space-between}.rw>div:first-child{min-width:0;flex:1}
.rw b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tb>*{flex:1;min-width:140px}.tb .btn{flex:0 0 auto}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eef3f6;text-transform:capitalize;margin:2px 4px 2px 0}
.b.pending,.b.receipt_submitted,.b.under_review{background:#fff4d6;color:var(--wn)}
.b.completed,.b.ready,.b.paid,.b.on{background:#dff3e4;color:var(--ok)}
.b.cancelled,.b.rejected,.b.failed,.b.off{background:#fbe3df;color:var(--er)}
.b.accepted,.b.printing{background:#e1f1f8;color:var(--brand)}
.th{width:44px;height:44px;border-radius:10px;background:#e9f0f4 center/cover;flex:0 0 44px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.ln span:first-child{color:var(--mu)}
.mo{display:none;position:fixed;inset:0;background:rgba(15,37,54,.55);z-index:50;align-items:flex-end;justify-content:center}
.mo.on{display:flex}.box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:18px}.mh button{font-size:26px;color:var(--mu)}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.ac.end{justify-content:flex-end}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;display:none;max-width:90vw;font-size:14px}#toast.er{background:var(--er)}
@media(min-width:900px){
 .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:220px;background:var(--brand);color:#fff;padding:18px 12px}
 .lg{padding:6px 10px 18px}.lg b{color:#fff;font-size:17px;display:block}.lg small{opacity:.6}
 .side a{display:flex;justify-content:space-between;color:rgba(255,255,255,.78);text-decoration:none;padding:11px 12px;border-radius:10px;margin-bottom:3px;font-size:14px}
 .side a.on{background:var(--c2);color:#fff;font-weight:700}.side .n{background:var(--er);color:#fff;border-radius:99px;padding:0 8px;font-size:12px}
 .lo{margin-top:auto;text-align:left;padding:11px 12px;color:rgba(255,255,255,.7)}
 .wrap{margin-left:220px}#mnav{display:none}.top b{display:none}.stats{grid-template-columns:repeat(4,1fr)}
 .mo{align-items:center}.box{border-radius:18px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase-config.js"></script>
</head>
<body>
<aside class="side"><div class="lg"><b>Janu Print <span>| FAB</span></b><small>Admin</small></div><div id="nav"></div><button class="lo" data-act="logout">Log out</button></aside>
<div class="wrap">
<header class="top"><b>Janu Print <span>| FAB</span></b><span class="sp"></span><small id="who"></small><button class="btn alt sm" data-act="refresh">↻ Refresh</button><button class="btn alt sm" data-act="logout">Log out</button></header>
<nav class="chips" id="mnav"></nav>
<main id="view"><div class="empty">Loading…</div></main>
</div>
<div class="mo" id="modal"></div><div id="toast"></div>

<script>
const $=s=>document.querySelector(s),db=window.db;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const ST=['pending','accepted','printing','ready','completed'];
const PAGES=[['home','Home'],['orders','Orders'],['products','Products'],['categories','Categories'],['delivery','Delivery'],['settings','Settings']];
const PAYL={pending:'Awaiting payment',receipt_submitted:'Receipt to check',under_review:'Under review',paid:'Paid',rejected:'Rejected',failed:'Failed',refunded:'Refunded'};
let S={cats:[],prods:[],orders:[],slots:[],dset:{},contact:null,filter:'all',q:'',pq:'',pc:''};
const money=v=>`${S.contact?.currency||'LKR'} ${Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const ref=o=>o.order_number||String(o.id).slice(0,8);
const fd=v=>{if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const dd=v=>v?String(v).slice(0,10):'—';
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'er':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',bad?6000:2500)}
const must=r=>{if(r.error)throw r.error;return r.data};
const ok=async p=>{try{return must(await p)||[]}catch(e){console.warn(e);toast('Could not load Supabase data: '+(e.message||e),1);return[]}};

/* ---------- data ---------- */
async function loadAll(){
 const [c,p,o,sl,ds,ct]=await Promise.all([
  ok(db.from('categories').select('*').order('display_order').order('name')),
  ok(db.from('products').select('*').order('display_order').order('name')),
  ok(db.from('orders').select('*, customers(name,phone), order_items(*)').order('created_at',{ascending:false}).limit(300)),
  ok(db.from('delivery_slots').select('*').order('display_order')),
  ok(db.from('delivery_settings').select('*')),
  db.from('contact_details').select('*').eq('id','main').maybeSingle().then(r=>{if(r.error){console.warn(r.error);toast('Could not load contact settings: '+r.error.message,1);return null}return r.data},e=>{console.warn(e);toast('Could not load contact settings: '+(e.message||e),1);return null})]);
 S.cats=c;S.prods=p;S.orders=o;S.slots=sl;S.dset=Object.fromEntries(ds.map(x=>[x.category_id,x]));S.contact=ct||{};
 render();
}
const catName=id=>S.cats.find(c=>c.id===id)?.name||'No category';
const needsPay=o=>['receipt_submitted','under_review'].includes(o.payment_status);
const mainItem=o=>{const i=o.order_items||[];return i.length?i[0].product_name+(i.length>1?` +${i.length-1} more`:''):'Order'};

/* ---------- layout / routing ---------- */
const page=()=>(location.hash.slice(1)||'home').split('/')[0];
function render(){
 const pg=PAGES.some(p=>p[0]===page())?page():'home',n=S.orders.filter(o=>o.status==='pending').length;
 $('#nav').innerHTML=PAGES.map(([k,l])=>`<a href="#${k}" class="${k===pg?'on':''}">${l}${k==='orders'&&n?`<span class="n">${n}</span>`:''}</a>`).join('');
 $('#mnav').innerHTML=PAGES.map(([k,l])=>`<a href="#${k}" class="chip ${k===pg?'on':''}">${l}${k==='orders'&&n?` (${n})`:''}</a>`).join('');
 const v=$('#view'),y=$('#view').scrollTop;({home,orders,products,categories,delivery,settings})[pg](v);
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* ---------- modal helpers ---------- */
const closeM=()=>{$('#modal').classList.remove('on');$('#modal').innerHTML=''};
function modal(title,body,save,label='Save'){
 $('#modal').innerHTML=`<div class="box"><div class="mh"><h3>${title}</h3><button data-act="close" aria-label="Close">×</button></div>${body}${save?`<div class="ac end"><button class="btn alt" data-act="close">Cancel</button><button class="btn" id="msave">${label}</button></div>`:''}</div>`;
 $('#modal').classList.add('on');
 if(save)$('#msave').onclick=async e=>{e.target.disabled=true;try{await save();closeM()}catch(x){console.error(x);toast(x.message||String(x),1);e.target.disabled=false}};
}
const val=id=>$('#'+id).value;
const F=(id,l,v='',t='text',x='')=>`<label class="l" for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}>`;
const SEL=(id,l,v,o)=>`<label class="l" for="${id}">${l}</label><select id="${id}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const YN=(id,l,v,a='Yes',b='No')=>SEL(id,l,String(v),[['true',a],['false',b]]);

/* ---------- HOME ---------- */
function home(v){
 const c=f=>S.orders.filter(f).length,pay=c(needsPay);
 const st=[['New orders','pending',c(o=>o.status==='pending'),1],['In production','making',c(o=>['accepted','printing'].includes(o.status))],['Ready','ready',c(o=>o.status==='ready')],['Receipts to check','pay',pay,1]];
 v.innerHTML=`<h1>Today</h1><p class="m">What needs you right now.</p>
 <div class="stats">${st.map(([l,f,n,h])=>`<button class="stat ${h&&n?'hot':''}" data-act="goto" data-f="${f}"><b>${n}</b><span>${l}</span></button>`).join('')}</div>
 <h2>Latest orders</h2>${S.orders.slice(0,6).map(orderRow).join('')||'<div class="empty">No orders yet.</div>'}`;
}
function orderRow(o){
 return `<button class="card rw" style="width:100%;text-align:left" data-act="order" data-id="${esc(o.id)}"><div><b>#${esc(ref(o))} · ${esc(o.customers?.name||o.customers?.phone||'Customer')}</b><span class="m">${esc(mainItem(o))} · ${fd(o.created_at)}</span><div><span class="b ${esc(o.status)}">${esc(o.status)}</span>${o.payment_status&&o.payment_status!=='pending'?`<span class="b ${esc(o.payment_status)}">${esc(PAYL[o.payment_status]||o.payment_status)}</span>`:''}${o.urgent_order?'<span class="b rejected">Urgent</span>':''}</div></div><b style="flex:0 0 auto">${money(o.total_amount)}</b></button>`;
}

/* ---------- ORDERS ---------- */
const FILTERS=[['all','All'],['pending','New'],['making','In production'],['ready','Ready'],['completed','Completed'],['cancelled','Cancelled'],['pay','Receipts to check']];
function orders(v){
 const f=S.filter,q=S.q.toLowerCase();
 const list=S.orders.filter(o=>(f==='all'||(f==='making'?['accepted','printing'].includes(o.status):f==='pay'?needsPay(o):o.status===f))&&(!q||[ref(o),o.customers?.name,o.customers?.phone,mainItem(o)].join(' ').toLowerCase().includes(q)));
 v.innerHTML=`<h1>Orders</h1><div class="chips" style="padding:8px 0">${FILTERS.map(([k,l])=>`<button class="chip ${k===f?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>
 <div class="tb"><input id="oq" placeholder="Search order no, name, phone…" value="${esc(S.q)}"></div>${list.map(orderRow).join('')||'<div class="empty">No orders here.</div>'}`;
 $('#oq').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;orders(v);const i=$('#oq');i.focus();i.setSelectionRange(p,p)};
}
function openOrder(id){
 const o=S.orders.find(x=>x.id===id);if(!o)return;
 const items=o.order_items||[],cu=o.customers||{},ph=String(cu.phone||o.customer_phone||'').replace(/\D/g,''),idx=ST.indexOf(o.status),next=ST[idx+1];
 const files=items.flatMap(i=>{let u=i.artwork_urls;if(typeof u==='string'){try{u=JSON.parse(u)}catch(e){u=[u]}}return Array.isArray(u)?u.filter(Boolean):[]});
 const sub=items.reduce((s,i)=>s+Number(i.line_total||0),0);
 modal(`Order #${esc(ref(o))}`,`
 <p class="m">${fd(o.created_at)}</p><div style="margin:6px 0"><span class="b ${esc(o.status)}">${esc(o.status)}</span>${o.urgent_order?'<span class="b rejected">Urgent</span>':''}</div>
 <h2>Customer</h2><div class="card"><b>${esc(cu.name||'—')}</b><div class="m">${esc(cu.phone||o.customer_phone||'')}</div>
  ${ph?`<div class="ac"><a class="btn alt sm" href="tel:+${ph}">Call</a><a class="btn alt sm" target="_blank" rel="noopener" href="https://wa.me/${ph}">WhatsApp</a></div>`:''}</div>
 <h2>Items</h2>${items.map(i=>`<div class="card"><div class="ln"><b>${esc(i.product_name)}</b><b>${money(i.line_total)}</b></div><div class="m">Qty ${esc(i.quantity)} × ${money(i.unit_price)}</div>
  ${((i.selected_options||{}).selections||[]).map(s=>`<div class="ln"><span>${esc(s.label)}</span><span>${esc(s.value)}</span></div>`).join('')}${i.artwork_notes?`<div class="m">${esc(i.artwork_notes)}</div>`:''}</div>`).join('')}
 <div class="ln"><span>Items subtotal</span><span>${money(sub)}</span></div><div class="ln"><b>Order total</b><b>${money(o.total_amount)}</b></div>
 ${files.length?`<h2>Customer design files</h2><div class="ac" style="margin-top:0">${files.map((u,n)=>`<button class="btn alt sm" data-act="file" data-b="artwork" data-u="${esc(u)}">Design ${n+1}</button>`).join('')}</div>`:''}
 <h2>Delivery</h2><div class="card"><div class="ln"><span>Method / slot</span><span>${esc(o.delivery_option||S.slots.find(s=>s.id===o.delivery_slot_id)?.slot_name||'—')}</span></div><div class="ln"><span>Date</span><span>${dd(o.delivery_date||o.estimated_ready_date)}</span></div><div class="ln"><span>Delivery fee</span><span>${money(o.delivery_fee)}</span></div><div class="ln"><span>Production time</span><span>${o.production_days==null?'—':esc(o.production_days)+' days'}</span></div>${o.delivery_address?`<div class="ln"><span>Address</span><span>${esc(o.delivery_address)}</span></div>`:''}${o.notes?`<div class="m">Note: ${esc(o.notes)}</div>`:''}</div>
 <h2>Payment</h2><div class="card"><div class="ln"><span>Method</span><span>${esc(o.payment_method||'—')}</span></div><div class="ln"><span>Status</span><span class="b ${esc(o.payment_status||'pending')}">${esc(PAYL[o.payment_status||'pending']||o.payment_status)}</span></div>
  ${o.payment_reference?`<div class="ln"><span>Reference</span><span>${esc(o.payment_reference)}</span></div>`:''}${o.payment_notes?`<div class="m">${esc(o.payment_notes)}</div>`:''}
  <div class="ac">${o.payment_receipt_url?`<button class="btn alt sm" data-act="file" data-b="payment-slips" data-u="${esc(o.payment_receipt_url)}">View receipt</button>`:''}
  ${needsPay(o)?`<button class="btn ok sm" data-act="pay" data-id="${esc(o.id)}" data-d="paid">Approve payment</button><button class="btn er sm" data-act="pay" data-id="${esc(o.id)}" data-d="rejected">Reject</button>`:''}</div></div>
 <h2>Production status</h2><div class="ac" style="margin-top:0">${o.status==='cancelled'?`<button class="btn alt sm" data-act="status" data-id="${esc(o.id)}" data-s="pending">Re-open order</button>`:
  `${next?`<button class="btn" data-act="status" data-id="${esc(o.id)}" data-s="${next}">Move to: ${next}</button>`:'<span class="m">Order completed ✔</span>'}
   ${o.status!=='completed'?`<button class="btn er sm" data-act="status" data-id="${esc(o.id)}" data-s="cancelled">Cancel order</button>`:''}`}</div>`);
}
async function setStatus(id,s){
 if(s==='cancelled'&&!confirm('Cancel this order?'))return;
 must(await db.from('orders').update({status:s}).eq('id',id));
 await db.from('order_status_history').insert({order_id:id,status:s,note:'Updated by admin'}).then(()=>{},()=>{});
 toast('Status: '+s);await loadAll();openOrder(id);
}
async function reviewPay(id,d){
 let note=null;if(d==='rejected'){note=prompt('Reason for rejecting (customer will need to re-send):');if(!note)return}
 must(await db.rpc('jpf_admin_review_payment',{p_order_id:id,p_decision:d,p_note:note}));
 toast(d==='paid'?'Payment approved':'Payment rejected');await loadAll();openOrder(id);
}
const stPath=(v,b)=>{v=String(v||'').trim();if(!/^https?:/i.test(v))return v.replace(/^\/+/,'');try{const p=decodeURIComponent(new URL(v).pathname),m='/'+b+'/',i=p.indexOf(m);if(i>=0)return p.slice(i+m.length)}catch(e){}return v};
async function openFile(b,u){
 const w=window.open('','_blank');
 try{const r=await db.storage.from(b).createSignedUrl(stPath(u,b),600);let url=r.data?.signedUrl;if(!url){if(/^https?:/i.test(u))url=u;else throw r.error||new Error('File not found')}w.location=url}
 catch(e){w&&w.close();toast('Could not open file: '+(e.message||e),1)}
}

/* ---------- PRODUCTS ---------- */
function products(v){
 const q=S.pq.toLowerCase(),list=S.prods.filter(p=>(!S.pc||p.category_id===S.pc)&&(!q||(p.name||'').toLowerCase().includes(q)));
 v.innerHTML=`<h1>Products</h1><p class="m">Shown on the customer Shop page.</p>
 <div class="tb"><input id="pq" placeholder="Search products…" value="${esc(S.pq)}"><select id="pc"><option value="">All categories</option>${S.cats.map(c=>`<option value="${esc(c.id)}" ${c.id===S.pc?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn" data-act="prod">+ Add product</button></div>
 ${list.map(p=>{const img=p.featured_image||(Array.isArray(p.images)&&p.images[0])||'',pub=p.price_is_published!==false;return `<div class="card rw"><div class="th" style="background-image:url('${esc(img)}')"></div><div><b>${esc(p.name)}</b><span class="m">${esc(catName(p.category_id))} · ${pub?money(p.discount_price||p.price):'Get a quote'}</span><div><span class="b ${p.is_visible===false?'off':'on'}">${p.is_visible===false?'Hidden':'Visible'}</span></div></div>
 <div class="ac" style="margin:0"><button class="btn alt sm" data-act="prod" data-id="${esc(p.id)}">Edit</button><button class="btn alt sm" data-act="pvis" data-id="${esc(p.id)}">${p.is_visible===false?'Show':'Hide'}</button></div></div>`}).join('')||'<div class="empty">No products found.</div>'}`;
 $('#pq').oninput=e=>{S.pq=e.target.value;const p=e.target.selectionStart;products(v);const i=$('#pq');i.focus();i.setSelectionRange(p,p)};
 $('#pc').onchange=e=>{S.pc=e.target.value;products(v)};
}
function prodForm(id){
 const p=S.prods.find(x=>x.id===id)||{},img=p.featured_image||(Array.isArray(p.images)&&p.images[0])||'';
 modal(id?'Edit product':'Add product',
  F('pn','Product name *',p.name)+SEL('pcat','Category',p.category_id||'',[['','No category'],...S.cats.map(c=>[c.id,c.name])])+
  `<label class="l" for="pd">Description</label><textarea id="pd">${esc(p.description||'')}</textarea>`+
  `<div class="g2"><div>${F('pp','Price',p.price??0,'number','min="0" step="0.01"')}</div><div>${F('pdis','Discount price (optional)',p.discount_price??'','number','min="0" step="0.01"')}</div></div>`+
  F('pi','Image URL',img,'url','placeholder="https://..."')+
  SEL('ppub','Price','' + (p.price_is_published!==false&&id?'true':id?'false':'false'),[['true','Show price — customers can order'],['false','Get a quote — customers contact you']])+
  `<div class="g2"><div>${YN('pvis','Shop visibility',p.is_visible!==false,'Visible','Hidden')}</div><div>${F('pord','Display order',p.display_order??S.prods.length+1,'number','step="1"')}</div></div>`,
  async()=>{
   const name=val('pn').trim(),price=Number(val('pp')),dr=val('pdis').trim(),dis=dr===''?null:Number(dr),pub=val('ppub')==='true',img=val('pi').trim();
   if(!name)throw new Error('Enter a product name.');
   if(!Number.isFinite(price)||price<0||(dis!==null&&(!Number.isFinite(dis)||dis<0)))throw new Error('Enter a valid price.');
   if(pub&&!((dis!==null&&dis>0)||price>0))throw new Error('To show a price, enter a price above 0 — or choose "Get a quote".');
   const payload={name,category_id:val('pcat')||null,description:val('pd').trim(),price,discount_price:dis,images:img?[img]:(Array.isArray(p.images)?p.images:[]),is_visible:val('pvis')==='true',display_order:Number(val('pord'))||0,price_is_published:pub};
   must(id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload));
   toast('Product saved');await loadAll();
  });
}

/* ---------- CATEGORIES ---------- */
const slug=n=>String(n||'').normalize('NFKD').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||('category-'+Date.now());
function categories(v){
 v.innerHTML=`<h1>Categories</h1><div class="tb"><button class="btn" data-act="cat">+ Add category</button></div>
 ${S.cats.map(c=>`<div class="card rw"><div><b>${esc(c.name)}</b><span class="m">${S.prods.filter(p=>p.category_id===c.id).length} products</span><div><span class="b ${c.is_visible===false?'off':'on'}">${c.is_visible===false?'Hidden':'Visible'}</span></div></div>
 <div class="ac" style="margin:0"><button class="btn alt sm" data-act="cat" data-id="${esc(c.id)}">Edit</button><button class="btn er sm" data-act="catdel" data-id="${esc(c.id)}">Delete</button></div></div>`).join('')||'<div class="empty">No categories yet.</div>'}`;
}
function catForm(id){
 const c=S.cats.find(x=>x.id===id)||{};
 modal(id?'Edit category':'Add category',F('cn','Category name',c.name)+YN('cv','Status',c.is_visible!==false,'Visible','Hidden'),async()=>{
  const name=val('cn').trim();if(!name)throw new Error('Enter a category name.');
  const p={name,slug:slug(name),is_visible:val('cv')==='true'};
  must(id?await db.from('categories').update(p).eq('id',id):await db.from('categories').insert({...p,display_order:S.cats.reduce((m,x)=>Math.max(m,Number(x.display_order)||0),0)+1}));
  toast('Category saved');await loadAll();
 });
}

/* ---------- DELIVERY ---------- */
function delivery(v){
 v.innerHTML=`<h1>Delivery</h1><p class="m">Production days and urgent options per category, plus delivery time slots.</p><h2>Per category</h2>
 ${S.cats.map(c=>{const d=S.dset[c.id];return `<div class="card rw"><div><b>${esc(c.name)}</b><span class="m">${d?`${d.normal_production_days??0} days · Delivery: ${money(d.normal_delivery_fee)} · Urgent: ${d.urgent_available?`${d.urgent_delivery_days??0} days, +${money(d.urgent_extra_fee)}`:'not available'}`:'Not set yet'}</span></div><button class="btn alt sm" data-act="dset" data-id="${esc(c.id)}">Edit</button></div>`}).join('')||'<div class="empty">Add a category first.</div>'}
 <h2>Time slots</h2><div class="tb"><button class="btn" data-act="slot">+ Add time slot</button></div>
 ${S.slots.map(s=>`<div class="card rw"><div><b>${esc(s.slot_name)}</b><span class="m">${esc(String(s.start_time||'').slice(0,5))}${s.end_time?' – '+esc(String(s.end_time).slice(0,5)):''} · +${money(s.additional_fee)}</span><div><span class="b ${s.is_active===false?'off':'on'}">${s.is_active===false?'Hidden':'Active'}</span></div></div>
 <div class="ac" style="margin:0"><button class="btn alt sm" data-act="slot" data-id="${esc(s.id)}">Edit</button><button class="btn er sm" data-act="slotdel" data-id="${esc(s.id)}">Delete</button></div></div>`).join('')||'<div class="empty">No time slots yet.</div>'}`;
}
function dsetForm(cid){
 const d=S.dset[cid]||{};
 modal(esc(catName(cid))+' — delivery',F('dd','Normal production days',d.normal_production_days??1,'number','min="0" step="1"')+F('dnf','Normal delivery fee',d.normal_delivery_fee??0,'number','min="0" step="0.01"')+YN('du','Urgent orders',!!d.urgent_available,'Available','Not available')+
  `<div class="g2"><div>${F('dud','Urgent delivery days',d.urgent_delivery_days??1,'number','min="0" step="1"')}</div><div>${F('duf','Urgent extra fee',d.urgent_extra_fee??0,'number','min="0" step="0.01"')}</div></div>`,async()=>{
  const p={normal_production_days:Math.max(0,Number(val('dd'))||0),normal_delivery_fee:Math.max(0,Number(val('dnf'))||0),urgent_available:val('du')==='true',urgent_delivery_days:Math.max(0,Number(val('dud'))||0),urgent_extra_fee:Math.max(0,Number(val('duf'))||0)};
  must(d.category_id?await db.from('delivery_settings').update(p).eq('category_id',cid):await db.from('delivery_settings').insert({category_id:cid,...p}));
  toast('Delivery settings saved');await loadAll();
 });
}
function slotForm(id){
 const s=S.slots.find(x=>x.id===id)||{};
 modal(id?'Edit time slot':'Add time slot',F('sn','Slot name',s.slot_name,'text','placeholder="Morning"')+`<div class="g2"><div>${F('ss','Start',String(s.start_time||'').slice(0,5),'time')}</div><div>${F('se','End',String(s.end_time||'').slice(0,5),'time')}</div></div>`+F('sf','Extra fee',s.additional_fee??0,'number','min="0" step="0.01"')+YN('sa','Status',s.is_active!==false,'Active','Hidden'),async()=>{
  const name=val('sn').trim();if(!name)throw new Error('Enter a slot name.');
  const p={slot_name:name,start_time:val('ss')||null,end_time:val('se')||null,additional_fee:Math.max(0,Number(val('sf'))||0),is_active:val('sa')==='true'};
  must(id?await db.from('delivery_slots').update(p).eq('id',id):await db.from('delivery_slots').insert({...p,display_order:S.slots.reduce((m,x)=>Math.max(m,Number(x.display_order)||0),0)+1}));
  toast('Time slot saved');await loadAll();
 });
}

/* ---------- SETTINGS ---------- */
const SET=[['whatsapp','WhatsApp number'],['currency','Currency'],['bank_name','Bank name'],['bank_account_name','Account name'],['bank_account_number','Account number'],['bank_branch','Branch']];
function settings(v){
 const c=S.contact||{};
 v.innerHTML=`<h1>Settings</h1><p class="m">Contact and bank details shown to customers at checkout.</p><div class="card">
 ${SET.map(([k,l])=>F('s_'+k,l,c[k]||'')).join('')}<label class="l" for="s_bank_instructions">Payment instructions</label><textarea id="s_bank_instructions">${esc(c.bank_instructions||'')}</textarea>
 <div class="ac"><button class="btn" data-act="saveset">Save settings</button></div></div>`;
}
async function saveSettings(){
 const p={id:'main',bank_instructions:val('s_bank_instructions').trim()};SET.forEach(([k])=>p[k]=val('s_'+k).trim());
 if(!p.currency)p.currency='LKR';
 must(await db.from('contact_details').upsert(p,{onConflict:'id'}));toast('Settings saved');await loadAll();
}

/* ---------- actions ---------- */
async function logout(){try{await db.auth.signOut()}catch(e){}location.href='login.html'}
document.addEventListener('click',e=>{
 if(e.target===$('#modal'))return closeM();
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id,run=p=>Promise.resolve(p).catch(x=>{console.error(x);toast(x.message||String(x),1)});
 if(a==='close')closeM();
 else if(a==='logout')logout();
 else if(a==='refresh')run(loadAll().then(()=>toast('Refreshed')));
 else if(a==='goto'){S.filter=b.dataset.f==='pending'?'pending':b.dataset.f;location.hash='#orders';render()}
 else if(a==='filter'){S.filter=b.dataset.f;render()}
 else if(a==='order')openOrder(id);
 else if(a==='status')run(setStatus(id,b.dataset.s));
 else if(a==='pay')run(reviewPay(id,b.dataset.d));
 else if(a==='file')openFile(b.dataset.b,b.dataset.u);
 else if(a==='prod')prodForm(id);
 else if(a==='pvis'){const p=S.prods.find(x=>x.id===id);run((async()=>{must(await db.from('products').update({is_visible:p.is_visible===false}).eq('id',id));await loadAll()})())}
 else if(a==='cat')catForm(id);
 else if(a==='catdel'){if(confirm('Delete this category? If products use it, hide it instead.'))run((async()=>{must(await db.from('categories').delete().eq('id',id));toast('Category deleted');await loadAll()})())}
 else if(a==='dset')dsetForm(id);
 else if(a==='slot')slotForm(id);
 else if(a==='slotdel'){if(confirm('Delete this time slot?'))run((async()=>{must(await db.from('delivery_slots').delete().eq('id',id));toast('Time slot deleted');await loadAll()})())}
 else if(a==='saveset')run(saveSettings());
});

/* ---------- start: same admin check as before ---------- */
(async()=>{
 try{
  if(!db||!db.auth)throw new Error('No Supabase client');
  const{data:{user},error}=await db.auth.getUser();
  if(error||!user)return location.href='login.html';
  const{data:adm}=await db.from('admin_profiles').select('id').eq('id',user.id).maybeSingle();
  if(!adm){await db.auth.signOut();return location.href='login.html'}
  $('#who').textContent=user.email||'';
  await loadAll();
  try{db.channel('jp-orders').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},()=>{toast('🔔 New order received');loadAll()}).subscribe()}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()});
 }catch(e){console.error('Admin session check failed',e);location.href='login.html'}
})();
</script>
</body>
</html>
