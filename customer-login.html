<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Sign In | Janu Print FAB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
    .auth-card { max-width: 440px; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.4rem; }
    .auth-tab {
        flex: 1; padding: 0.65rem; border: 1px solid #ddd; background: var(--light-gray);
        border-radius: var(--radius-sm); font-weight: 600; font-size: 0.82rem; cursor: pointer;
    }
    .auth-tab.active { background: var(--metallic-blue-dark); color: #fff; border-color: var(--metallic-blue-dark); }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .btn-google {
        width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 50px;
        background: #fff; font-weight: 600; cursor: pointer; display: flex;
        align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 1rem;
    }
    .btn-google:hover { border-color: var(--metallic-blue); background: #f9fdff; }
    .divider { text-align: center; color: var(--text-light); font-size: 0.82rem; margin: 1rem 0; position: relative; }
    .divider::before, .divider::after {
        content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: #ddd;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
</style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div style="text-align:center;">
            <span class="auth-badge auth-badge-customer"><i class="fas fa-user"></i> Customer Account</span>
        </div>
        <h1>Janu Print | FAB</h1>
        <p class="auth-subtitle">Sign in with Google or create an account with your phone &amp; NIC</p>

        <div id="statusMsg" class="auth-msg"></div>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-tab="login">Login</button>
            <button type="button" class="auth-tab" data-tab="register">Create Account</button>
        </div>

        <div id="panelLogin" class="auth-panel active">
            <button type="button" class="btn-google" id="googleLoginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt=""> Continue with Google
            </button>
            <div class="divider">or login with phone</div>
            <form id="loginForm">
                <label for="loginPhone">Phone Number</label>
                <input type="tel" id="loginPhone" required placeholder="+947... or +971...">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="Your password">
                <button type="submit" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Login</button>
            </form>
        </div>

        <div id="panelRegister" class="auth-panel">
            <button type="button" class="btn-google" id="googleRegisterBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt=""> Sign up with Google
            </button>
            <div class="divider">or register with details</div>
            <form id="registerForm">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" required placeholder="Your full name">
                <label for="regPhone">Phone Number</label>
                <input type="tel" id="regPhone" required placeholder="+947... or +971...">
                <label for="regNic">NIC Number</label>
                <input type="text" id="regNic" required placeholder="National Identity Card number">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" required minlength="6" placeholder="Min 6 characters">
                <label for="regPassword2">Confirm Password</label>
                <input type="password" id="regPassword2" required minlength="6" placeholder="Repeat password">
                <button type="submit" id="registerBtn"><i class="fas fa-user-plus"></i> Create Account</button>
            </form>
        </div>

        <a href="index.html" class="auth-back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase-config.js"></script>
    <script src="assets/customer-auth.js"></script>
    <script>
        const statusMsg = document.getElementById('statusMsg');

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = type ? `auth-msg ${type}` : 'auth-msg';
        }

        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab === 'login' ? 'panelLogin' : 'panelRegister').classList.add('active');
                statusMsg.className = 'auth-msg';
                statusMsg.style.display = 'none';
            });
        });

        async function doGoogleAuth() {
            try {
                showStatus('Redirecting to Google...', 'success');
                await JPFCustomerAuth.signInWithGoogle();
            } catch (err) {
                showStatus(err.message || 'Google sign-in failed. Enable Google provider in Supabase dashboard.', 'error');
            }
        }

        document.getElementById('googleLoginBtn').addEventListener('click', doGoogleAuth);
        document.getElementById('googleRegisterBtn').addEventListener('click', doGoogleAuth);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            try {
                await JPFCustomerAuth.loginWithPhone({
                    phone: document.getElementById('loginPhone').value.trim(),
                    password: document.getElementById('loginPassword').value
                });
                window.location.href = 'account.html';
            } catch (err) {
                showStatus(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Login';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('regPassword').value;
            const pw2 = document.getElementById('regPassword2').value;
            if (pw !== pw2) {
                showStatus('Passwords do not match.', 'error');
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            try {
                await JPFCustomerAuth.registerWithPhone({
                    name: document.getElementById('regName').value.trim(),
                    phone: document.getElementById('regPhone').value.trim(),
                    nic: document.getElementById('regNic').value.trim(),
                    password: pw
                });
                showStatus('Account created! You can now shop and track orders.', 'success');
                setTimeout(() => { window.location.href = 'account.html'; }, 1200);
            } catch (err) {
                showStatus(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        (async () => {
            try {
                const profile = await JPFCustomerAuth.handleOAuthCallback();
                if (profile) window.location.href = 'account.html';
            } catch (err) {
                showStatus(err.message, 'error');
            }
        })();
    </script>
</body>
</html>
