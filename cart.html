<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Janu Print FAB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
    body { background: var(--light-gray); min-height: 100vh; }
    .cart-wrap { max-width: 960px; margin: 0 auto; padding: 2rem; }
    .cart-title { font-size: 1.8rem; color: var(--metallic-blue-dark); margin-bottom: 1.5rem; font-weight: 700; }
    .cart-item {
        display: grid; grid-template-columns: 90px 1fr auto; gap: 1rem;
        background: var(--white); border-radius: var(--radius-md); padding: 1rem;
        box-shadow: var(--shadow-sm); margin-bottom: 0.8rem; align-items: center;
    }
    .cart-item img { width: 90px; height: 90px; object-fit: cover; border-radius: var(--radius-sm); background: var(--panel-gray); }
    .cart-item-photo {
        width: 90px; height: 90px; border-radius: var(--radius-sm);
        background: var(--panel-gray); display: flex; align-items: center; justify-content: center;
        color: var(--metallic-blue); font-size: 1.8rem;
    }
    .cart-item h3 { font-size: 1rem; color: var(--metallic-blue-dark); margin-bottom: 0.2rem; }
    .cart-item p { font-size: 0.82rem; color: var(--text-light); }
    .qty-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
    .qty-controls button {
        width: 30px; height: 30px; border: 1px solid #ddd; background: #fff;
        border-radius: 6px; cursor: pointer; font-weight: 700;
    }
    .qty-controls span { min-width: 24px; text-align: center; font-weight: 600; }
    .cart-item-price { text-align: right; font-weight: 700; color: var(--metallic-blue-dark); }
    .remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.82rem; margin-top: 0.4rem; }
    .cart-summary {
        background: var(--white); border-radius: var(--radius-md); padding: 1.5rem;
        box-shadow: var(--shadow-md); border-top: 4px solid var(--gold-accent); margin-top: 1rem;
    }
    .summary-line { display: flex; justify-content: space-between; margin: 0.5rem 0; color: var(--text-light); }
    .summary-line.total { font-size: 1.2rem; font-weight: 700; color: var(--metallic-blue-dark); border-top: 1px solid #eee; padding-top: 0.8rem; margin-top: 0.8rem; }
    .empty-cart { text-align: center; padding: 3rem 1rem; background: var(--white); border-radius: var(--radius-md); }
    .checkout-btn { width: 100%; margin-top: 1rem; padding: 14px; border: none; border-radius: 50px; background: var(--gold-gradient); color: var(--metallic-blue-dark); font-weight: 700; font-size: 1rem; cursor: pointer; }
    .checkout-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #checkoutMsg { margin-top: 0.8rem; font-size: 0.88rem; }
    #checkoutMsg.success { color: var(--success); }
    #checkoutMsg.error { color: var(--danger); }
    @media (max-width: 600px) { .cart-item { grid-template-columns: 70px 1fr; } .cart-item-price { grid-column: 2; text-align: left; } }
</style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-container">
            <span>Shopping Cart</span>
            <a href="shop.html" style="color:#fff;text-decoration:none;"><i class="fas fa-shopping-bag"></i> Continue Shopping</a>
        </div>
    </div>

    <nav class="site-nav">
        <div class="nav-container">
            <a href="index.html" class="logo-wrap">
                <img class="logo-icon" src="https://i.ibb.co/h1TnrT8Y/LOGO.png" alt="Logo">
                <div class="logo-text-group">
                    <span class="logo-main">Janu Print <span>| FAB</span></span>
                    <span class="logo-tagline">Your Cart</span>
                </div>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html" class="btn-nav-cart"><i class="fas fa-shopping-cart"></i> Cart <span id="cartCount" class="cart-badge">0</span></a></li>
                <li id="navAuthGuest"><a href="customer-login.html" class="btn-nav btn-nav-customer"><i class="fas fa-user"></i> Sign In</a></li>
                <li id="navAuthUser" style="display:none"><a href="account.html" class="btn-nav btn-nav-customer"><i class="fas fa-user"></i> <span id="navUserName">Account</span></a></li>
            </ul>
            <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <div class="cart-wrap">
        <h1 class="cart-title"><i class="fas fa-shopping-cart"></i> Your Cart</h1>
        <div id="cartItems"></div>
        <div id="cartSummary" style="display:none;" class="cart-summary">
            <div class="summary-line"><span>Items</span><span id="summaryCount">0</span></div>
            <div class="summary-line total"><span>Subtotal</span><span id="summaryTotal">AED 0.00</span></div>
            <button type="button" class="checkout-btn" id="checkoutBtn"><i class="fas fa-check"></i> Place Order</button>
            <p id="checkoutMsg"></p>
            <p style="font-size:0.78rem;color:var(--text-light);margin-top:0.6rem;">Sign in required to checkout. Final price confirmed after artwork review.</p>
        </div>
    </div>

    <footer class="site-footer"><p>&copy; 2026 Janu Print | FAB</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase-config.js"></script>
    <script src="assets/customer-auth.js"></script>
    <script src="assets/cart.js"></script>
    <script src="assets/nav-user.js"></script>
    <script>
        document.getElementById('mobileToggle')?.addEventListener('click', () => {
            document.getElementById('navMenu').classList.toggle('active');
        });

        function renderCart() {
            const items = JPFCart.getItems();
            const container = document.getElementById('cartItems');
            const summary = document.getElementById('cartSummary');

            if (!items.length) {
                container.innerHTML = `<div class="empty-cart"><h3>Your cart is empty</h3><p style="color:var(--text-light);margin:0.8rem 0 1.2rem;">Browse products and add items like eBay.</p><a href="shop.html" class="btn-primary">Go to Shop</a></div>`;
                summary.style.display = 'none';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="cart-item" data-cart-id="${item.cartId}">
                    ${item.image
                        ? `<img src="${item.image}" alt="">`
                        : `<div class="cart-item-photo"><i class="fas fa-print"></i></div>`}
                    <div>
                        <h3>${escapeHtml(item.name)}</h3>
                        <p>${escapeHtml(item.category)} &bull; ${JPFCart.money(item.price)} each</p>
                        <div class="qty-controls">
                            <button type="button" class="qty-minus" data-id="${item.cartId}">−</button>
                            <span>${item.quantity}</span>
                            <button type="button" class="qty-plus" data-id="${item.cartId}">+</button>
                        </div>
                        <button type="button" class="remove-btn" data-id="${item.cartId}"><i class="fas fa-trash"></i> Remove</button>
                    </div>
                    <div class="cart-item-price">${JPFCart.money(item.price * item.quantity)}</div>
                </div>
            `).join('');

            summary.style.display = 'block';
            document.getElementById('summaryCount').textContent = JPFCart.getCount();
            document.getElementById('summaryTotal').textContent = JPFCart.money(JPFCart.getSubtotal());

            container.querySelectorAll('.qty-minus').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = JPFCart.getItems().find(i => i.cartId === btn.dataset.id);
                    if (item) JPFCart.updateQuantity(item.cartId, item.quantity - 1);
                    renderCart();
                });
            });
            container.querySelectorAll('.qty-plus').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = JPFCart.getItems().find(i => i.cartId === btn.dataset.id);
                    if (item) JPFCart.updateQuantity(item.cartId, item.quantity + 1);
                    renderCart();
                });
            });
            container.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    JPFCart.removeItem(btn.dataset.id);
                    renderCart();
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            const msg = document.getElementById('checkoutMsg');
            const btn = document.getElementById('checkoutBtn');
            msg.className = '';
            msg.textContent = '';

            const profile = await JPFCustomerAuth.getProfile();
            if (!profile) {
                window.location.href = 'customer-login.html';
                return;
            }

            const items = JPFCart.getItems();
            if (!items.length) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing order...';

            try {
                const orderId = crypto.randomUUID();
                const total = JPFCart.getSubtotal();
                const customerId = profile.userId || profile.id;

                await window.db.from('customers').upsert({
                    id: customerId,
                    name: profile.name,
                    phone: profile.phone,
                    email: profile.email
                }, { onConflict: 'id' });

                const { error: orderErr } = await window.db.from('orders').insert({
                    id: orderId,
                    customer_id: customerId,
                    status: 'pending',
                    total_amount: total,
                    payment_method: 'pending',
                    delivery_option: 'pickup',
                    notes: 'Cart checkout from website'
                });
                if (orderErr) throw orderErr;

                const orderItems = items.map(item => ({
                    id: crypto.randomUUID(),
                    order_id: orderId,
                    product_id: item.productId,
                    product_name: item.name,
                    quantity: item.quantity,
                    unit_price: item.price,
                    line_total: item.price * item.quantity,
                    selected_options: { source: 'cart', category: item.category },
                    artwork_urls: []
                }));

                const { error: itemsErr } = await window.db.from('order_items').insert(orderItems);
                if (itemsErr) throw itemsErr;

                await window.db.from('order_status_history').insert({
                    order_id: orderId,
                    status: 'pending',
                    note: 'Order placed from shopping cart.'
                });

                JPFCart.clear();
                renderCart();
                msg.className = 'success';
                msg.textContent = `Order placed! Total: ${JPFCart.money(total)}. View it in your account.`;
                setTimeout(() => { window.location.href = 'account.html'; }, 2000);
            } catch (err) {
                msg.className = 'error';
                msg.textContent = `Checkout failed: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Place Order';
            }
        });

        renderCart();
    </script>
</body>
</html>
