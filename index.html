<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4563">
<title>Janu Print | FAB — Order custom printing</title>
<link rel="stylesheet" href="app/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config/supabase-config.js"></script>
<script src="config/payhere-config.js"></script>
<script src="assets/customer-auth.js"></script>
<script src="app/payment.js"></script>
<script src="app/policies.js"></script>
<style id="jp-splash-css">
#jp-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 35%,#2a6286 0%,#1e4563 55%,#143247 100%);color:#fff;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  animation:jpSplashOut .35s ease 1.15s forwards}
#jp-splash .jp-title{font:800 34px/1.1 system-ui,'Noto Sans Sinhala',sans-serif;letter-spacing:-.02em;text-align:center;
  opacity:0;transform:translateY(14px) scale(.96);animation:jpRise .55s cubic-bezier(.2,.8,.2,1) .1s forwards}
#jp-splash .jp-title span{color:#d4af37;display:inline-block;opacity:0;transform:translateX(-10px);animation:jpSlide .45s ease .45s forwards}
#jp-splash .jp-sub{font:500 14px/1.3 system-ui,'Noto Sans Sinhala',sans-serif;color:rgba(255,255,255,.8);letter-spacing:.04em;
  opacity:0;animation:jpFade .4s ease .6s forwards}
#jp-splash .jp-bar{width:130px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}
#jp-splash .jp-bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#00c3dd,#d4af37);
  transform:translateX(-100%);animation:jpBar .95s ease-in-out .15s forwards}
@keyframes jpRise{to{opacity:1;transform:none}}
@keyframes jpSlide{to{opacity:1;transform:none}}
@keyframes jpFade{to{opacity:1}}
@keyframes jpBar{to{transform:translateX(0)}}
@keyframes jpSplashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){#jp-splash,#jp-splash *{animation-duration:.01s!important;animation-delay:0s!important}
  #jp-splash{animation-delay:.6s!important}}
</style>
<style id="jp-extra-css">
html{scroll-behavior:smooth}*{-webkit-tap-highlight-color:transparent}
.pc,.chip,.btn,.opt,.acts a,.acts button{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease}
.pc:active,.chip:active,.btn:active,.opt:active,.acts a:active,.acts button:active{transform:scale(.97)}
#jp-help{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9000;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font:600 14px system-ui,sans-serif}
#jp-help-btn{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:12px 16px;background:#25d366;color:#fff;font:inherit;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}
#jp-help-btn:active{transform:scale(.95)}
#jp-help .jp-menu{display:none;flex-direction:column;gap:8px}
#jp-help.open .jp-menu{display:flex;animation:jpPop .2s ease}
#jp-help .jp-menu a{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;background:#fff;color:#16486a;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#jp-help .jp-menu a.wa{background:#25d366;color:#fff}
@keyframes jpPop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@media(min-width:1100px){#jp-help{right:auto;left:28px;bottom:28px}}
</style>
</head>
<body>
<div id="jp-splash" aria-hidden="true">
  <div class="jp-title">Janu Print <span>| FAB</span></div>
  <div class="jp-sub">Custom printing, made easy</div>
  <div class="jp-bar"><i></i></div>
</div>
<script>setTimeout(function(){var s=document.getElementById('jp-splash');if(s&&s.parentNode)s.parentNode.removeChild(s);},1700);</script>
<div id="app"></div>
<div id="jp-help"><div class="jp-menu">
  <a class="wa" id="jp-wa" href="https://wa.me/971524186102" target="_blank" rel="noopener">💬 WhatsApp us</a>
  <a href="tel:+971524186102">📞 Call +971 52 418 6102</a></div>
  <button id="jp-help-btn" type="button" aria-expanded="false" aria-label="Need help?">💬 Need help?</button></div>
<script>(function(){var w=document.getElementById('jp-help'),b=document.getElementById('jp-help-btn');
b.addEventListener('click',function(e){e.stopPropagation();var o=w.classList.toggle('open');b.setAttribute('aria-expanded',o);
document.getElementById('jp-wa').href='https://wa.me/971524186102?text='+encodeURIComponent('Hi Janu Print | FAB, I need help. ('+location.href+')')});
document.addEventListener('click',function(e){if(!w.contains(e.target)){w.classList.remove('open');b.setAttribute('aria-expanded',false)}})})();</script>
<script>window.JP_START='home';</script>
<script src="app/app.js"></script>
</body>
</html>
